<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DDR Nav Config</title>
    <link rel="stylesheet" href="config.css" />
  </head>
  <body>
    <h1>DDR Nav</h1>
    <p class="sub">Assign URLs to single arrows and optional arrow sequences, then Save.</p>

    <div class="grid">
      <label>
        <span>Left (←)</span>
        <input id="left" type="text" placeholder="https://example.com" />
      </label>

      <label>
        <span>Down (↓)</span>
        <input id="down" type="text" placeholder="https://example.com" />
      </label>

      <label>
        <span>Up (↑)</span>
        <input id="up" type="text" placeholder="https://example.com" />
      </label>

      <label>
        <span>Right (→)</span>
        <input id="right" type="text" placeholder="https://example.com" />
      </label>
    </div>

    <section class="combos">
      <div class="combos-header">
        <h2>Combo shortcuts</h2>
        <button id="addCombo" type="button" class="ghost">Add combo</button>
      </div>
      <p class="combos-sub">
        Sequence examples: <code>left,left</code>, <code>up right down</code>, or arrow symbols like <code>← ←</code>.
      </p>
      <div id="combosList" class="combos-list"></div>
    </section>

    <div class="row">
      <button id="save">Save</button>
      <span id="status" class="status"></span>
    </div>

    <p class="hint">
      Usage: Hold <b>Cmd + Shift + Y</b>, then enter one or more arrow keys.
    </p>

    <script src="config.js"></script>
  </body>
</html>
